<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Fahim Ahamed | Data & AI</title>
    <meta name="description" content="The page you were looking for could not be found." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/assets/favicon.png?v=5" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1115" />
    <link rel="preload" href="/assets/webfonts/space-grotesk-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/webfonts/space-grotesk-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/css/styles.css?v=211" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (err) {}
      })();
    </script>
    <script>
      // The pages moved into /pages/. GitHub Pages serves this file for any address it
      // cannot find, so old links (/experience.html, /projects.html#p-nexus-search, ...)
      // are forwarded here, keeping their query string and #fragment.
      (function () {
        var m = location.pathname.match(/^\/(experience|research|projects|data-stories|writing)(\.html)?\/?$/);
        if (m) location.replace('/pages/' + m[1] + '.html' + location.search + location.hash);
      })();
    </script>
    <style>
      .notfound {
        display: grid;
        place-items: center;
        min-height: calc(100vh - 76px);
        padding: 80px 24px;
        text-align: center;
      }
      .notfound h1 {
        max-width: 18ch;
        margin: 0 auto 20px;
        font-size: clamp(3rem, 7vw, 5.5rem);
        line-height: 0.96;
      }
      .notfound-text {
        max-width: 56ch;
        margin: 0 auto 28px;
        color: var(--muted);
        font-size: clamp(1.05rem, 1.6vw, 1.2rem);
        text-wrap: balance;
      }
      .notfound-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      @media (max-width: 560px) {
        .notfound { padding-inline: 16px; } /* the phone edge shared with the header */
      }
    </style>
    <noscript>
      <style>
        /* Reveal animations are JS-gated; without JS every section would stay at
           opacity 0. Ship the content visible instead. */
        .reveal { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>
  </head>
  <body>
    <header class="site-header">
    </header>

    <main class="notfound">
      <div>
        <p class="eyebrow">Error 404</p>
        <h1>This page<br>wandered off.</h1>
        <p class="notfound-text">The link you followed might be broken, or the page may have moved. Either way &mdash; you're a click away from finding your bearings.</p>
        <div class="notfound-actions">
          <a class="button primary" href="/">Back to Home</a>
          <a class="button secondary" href="/pages/data-stories.html">Data Stories</a>
        </div>
      </div>
    </main>

    <script src="/assets/js/site.js?v=45" defer></script>
  </body>
</html>
